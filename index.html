async function decrypt(b64, pw) {
  const data = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const salt = data.slice(0,16), iv = data.slice(16,28), ct = data.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(pt);
}
async function unlock() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  try {
    const html = await decrypt(BLOB, pw);
    sessionStorage.setItem('ro_pw', pw);
    document.open(); document.write(html); document.close();
  } catch(e) {
    err.textContent = 'Неверный пароль';
    document.getElementById('pw').value = '';
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
(async () => {
  const saved = sessionStorage.getItem('ro_pw');
  if (saved) { try {
    const html = await decrypt(BLOB, saved);
    document.open(); document.write(html); document.close();
  } catch(e){} }
})();
</script>
